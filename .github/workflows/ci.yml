name: CI

on:
  push:
    branches: [main, init]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the proxy against a live smoke target
        run: |
          npm run dev &
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf "http://localhost:3000/?q=https://example.com" | head -c 200

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: false
          load: true
          tags: webproxy:ci
      - name: Smoke test the container health endpoint
        run: |
          docker run -d --name wp -p 3000:3000 webproxy:ci
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:3000/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:3000/health
          docker rm -f wp
